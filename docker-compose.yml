services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: email-spam-api
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email-spam-ui
    ports:
      - "8501:8501"
    depends_on:
      - api